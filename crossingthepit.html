<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-Frame-Options" content="ALLOWALL">
  <title>Flash Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    ruffle-player {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <script>
    // =============================================
    // EDIT THESE 3 VALUES FOR EACH GAME
    const SWF_URL = "https://thatonesystemerror.github.io/flash-games/crossingthepit.swf";
    const GAME_WIDTH  = window.innerWidth;
    const GAME_HEIGHT = window.innerHeight;
    // =============================================

    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      player.style.width  = GAME_WIDTH  + "px";
      player.style.height = GAME_HEIGHT + "px";

      document.getElementById("game-container").appendChild(player);

      player.load({
        url: SWF_URL,
        allowScriptAccess: false,
        backgroundColor: "#000000",
        scale: "showAll",
        quality: "high",
        wmode: "transparent",
      });
    });
  </script>

</body>
</html>
